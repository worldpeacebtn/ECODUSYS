<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Spheres of Awakening – Holo Ecosystem</title>
    <!-- Tailwind CSS (with safelist for dynamic classes) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            safelist: [
                'text-emerald-400',
                'text-rose-500',
                'text-cyan-400',
                'text-fuchsia-400',
                'text-amber-400',
                'text-lime-400',
                'text-blue-400'
            ]
        }
    </script>
    <!-- Three.js & GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --primary: #0ff;
            --secondary: #f0f;
            --dark: #050510;
        }
        body {
            margin: 0; overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--dark);
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
        }
        
        .glass {
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        /* Spherical 3D Menu & HUD effects */
        .spherical-wrap {
            perspective: 1200px;
        }
        .spherical-menu {
            transform: rotateX(5deg) translateZ(50px);
            transform-style: preserve-3d;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        /* Paperdoll Visual Novel Portraits */
        .paperdoll-container {
            position: absolute;
            bottom: 0;
            left: 5%;
            width: 300px;
            height: 450px;
            pointer-events: none;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 40;
            filter: drop-shadow(0 0 20px rgba(0,255,255,0.4));
        }
        .paperdoll-container.active {
            transform: translateY(10px);
        }
        
        .avatar-aura {
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 20%, transparent 20%, rgba(0,255,255,0.2) 60%, transparent 80%);
            position: absolute;
        }
        
        .dialogue-box {
            background: linear-gradient(135deg, rgba(5,5,16,0.95) 0%, rgba(20,10,30,0.9) 100%);
            border-top: 2px solid var(--primary);
            border-left: 2px solid var(--secondary);
            box-shadow: -10px -10px 40px rgba(0,255,255,0.1), 10px 10px 40px rgba(255,0,255,0.1);
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        .glitch-text { animation: glitch 0.3s infinite; color: #ff0055; text-shadow: 2px 0 #0ff, -2px 0 #0f0; }

        .cursor::after {
            content: '█';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Additional Holo Effects */
        .holo-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0,255,255,0.2);
            pointer-events: none;
            animation: pulse-ring 4s ease-out infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Custom scrollbar for choices */
        #dialogue-choices::-webkit-scrollbar { width: 6px; }
        #dialogue-choices::-webkit-scrollbar-thumb { background: rgba(0,255,255,0.3); border-radius: 3px; }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Decorative Holo Rings (CSS) -->
    <div class="holo-ring" style="top:20%; left:10%; width:300px; height:300px;"></div>
    <div class="holo-ring" style="bottom:10%; right:15%; width:400px; height:400px; animation-delay:2s;"></div>

    <!-- Main Menu -->
    <div id="main-menu" class="fixed inset-0 z-50 flex items-center justify-center spherical-wrap bg-black/40 transition-opacity duration-1000">
        <div class="spherical-menu text-center glass p-10 rounded-3xl max-w-2xl w-full border-t border-cyan-400 border-b border-fuchsia-400">
            <h1 class="text-4xl md:text-6xl font-black mb-4 tracking-tighter uppercase text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-fuchsia-500" style="filter: drop-shadow(0 0 10px rgba(0,255,255,0.5));">
                Spheres of Awakening
            </h1>
            <p class="text-slate-300 text-sm md:text-lg mb-8 font-light tracking-wide">
                Eine Reise in das Hive-Mind der Menschheit.<br>
                Rette das planetare Ökosystem. Finde unsere gemeinsamen Träume.
            </p>
            <button id="btn-start" class="px-8 py-4 bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-500 hover:to-blue-600 rounded-full text-white font-bold tracking-widest uppercase transition-all shadow-[0_0_20px_rgba(0,255,255,0.5)] hover:scale-105 active:scale-95">
                Initiere Link
            </button>
        </div>
    </div>

    <!-- Game UI -->
    <div id="game-ui" class="fixed inset-0 z-40 pointer-events-none opacity-0 transition-opacity duration-1000 flex flex-col justify-between p-4 md:p-6 spherical-wrap">
        
        <!-- Curved HUD Top -->
        <header class="w-full flex justify-between items-start pointer-events-auto transform rotateX(-5deg)">
            <!-- Player Stats -->
            <div class="glass px-4 py-2 rounded-2xl flex items-center space-x-4 border-l-4 border-cyan-400">
                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center border-2 border-white/20 shadow-[0_0_15px_rgba(0,255,255,0.6)]">
                    <svg viewBox="0 0 24 24" class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <div>
                    <h2 class="text-sm font-black tracking-widest uppercase text-cyan-100">Projekt: Aura-Hase</h2>
                    <div class="flex items-center space-x-2 mt-1">
                        <span class="text-[10px] text-cyan-400 uppercase tracking-wider">Sync-Level</span>
                        <div class="w-24 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                            <div id="sync-bar" class="h-full bg-gradient-to-r from-cyan-400 to-fuchsia-500 shadow-[0_0_10px_rgba(0,255,255,0.8)]" style="width:100%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Objectives & Systems -->
            <div class="glass px-4 py-2 rounded-2xl flex flex-col items-end space-y-1 border-r-4 border-fuchsia-400">
                <div class="flex items-center space-x-2 text-xs font-bold text-fuchsia-300">
                    <span>Globale Resonanz:</span>
                    <span id="resonance-score">0%</span>
                </div>
                <div class="flex items-center space-x-2 text-[10px] text-slate-400">
                    <i data-lucide="globe" class="w-3 h-3"></i>
                    <span id="current-objective">Finde den Nexus-Baum</span>
                </div>
            </div>
        </header>

        <!-- Paperdoll Character Display -->
        <div id="paperdoll" class="paperdoll-container">
            <div class="avatar-aura"></div>
            <div id="character-art" class="w-full h-full relative z-10 flex items-end justify-center pb-4 drop-shadow-2xl"></div>
        </div>

        <!-- Dialogue Box (Bottom) -->
        <div id="dialogue-overlay" class="w-full max-w-4xl mx-auto pointer-events-auto transform translate-y-32 transition-transform duration-500 ease-out z-50 relative">
            <div class="dialogue-box rounded-t-3xl p-6 md:p-8 relative overflow-hidden backdrop-blur-xl">
                <div class="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl"></div>
                <div class="absolute bottom-0 left-0 w-32 h-32 bg-fuchsia-500/10 rounded-full blur-3xl"></div>
                
                <div class="relative z-10">
                    <div class="flex justify-between items-end mb-3 border-b border-white/10 pb-2">
                        <h3 id="speaker-name" class="text-xl md:text-2xl font-black uppercase tracking-widest text-cyan-300">Speaker</h3>
                        <span id="speaker-title" class="text-xs text-fuchsia-400 font-mono">Entity Role</span>
                    </div>
                    
                    <p id="dialogue-text" class="text-sm md:text-base lg:text-lg text-slate-200 leading-relaxed font-light min-h-[4rem] cursor">
                        ...
                    </p>

                    <div id="dialogue-choices" class="mt-6 space-y-2 hidden max-h-48 overflow-y-auto">
                        <!-- Buttons injected via JS -->
                    </div>

                    <div id="dialogue-next" class="mt-4 flex justify-end hidden">
                        <button id="btn-next-dialogue" class="flex items-center space-x-2 text-cyan-400 hover:text-white transition group">
                            <span class="text-xs tracking-widest uppercase">Fortfahren</span>
                            <i data-lucide="chevron-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls (Visible when not in dialogue) -->
        <div id="controls-ui" class="w-full flex justify-between items-end pointer-events-auto pb-4 px-2 transition-opacity duration-300">
            <!-- Joystick Base -->
            <div class="w-32 h-32 rounded-full glass flex items-center justify-center relative border border-cyan-500/30">
                <button id="btn-up" class="absolute top-2 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-cyan-300 flex items-center justify-center"><i data-lucide="arrow-up" class="w-4 h-4"></i></button>
                <button id="btn-down" class="absolute bottom-2 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-cyan-300 flex items-center justify-center"><i data-lucide="arrow-down" class="w-4 h-4"></i></button>
                <button id="btn-left" class="absolute left-2 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-cyan-300 flex items-center justify-center"><i data-lucide="arrow-left" class="w-4 h-4"></i></button>
                <button id="btn-right" class="absolute right-2 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-cyan-300 flex items-center justify-center"><i data-lucide="arrow-right" class="w-4 h-4"></i></button>
                <div class="text-[10px] text-cyan-500/50 font-bold">MOVE</div>
            </div>

            <div class="flex flex-col items-end space-y-4">
                <div id="interact-prompt" class="px-4 py-2 bg-fuchsia-600/80 rounded-xl text-white text-xs font-bold uppercase tracking-widest shadow-[0_0_15px_rgba(255,0,255,0.6)] hidden animate-pulse border border-fuchsia-400">
                    Drücke [E] oder Aktion
                </div>
                
                <button id="btn-action" class="w-16 h-16 rounded-full bg-gradient-to-br from-cyan-500 to-blue-700 text-white flex items-center justify-center shadow-[0_0_20px_rgba(0,255,255,0.5)] border-2 border-cyan-200/50 hover:scale-105 active:scale-95 transition">
                    <i data-lucide="zap" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const CharacterArt = {
            hero: `
                <svg viewBox="0 0 200 300" class="w-full h-full drop-shadow-[0_0_15px_rgba(0,255,255,0.8)]">
                    <defs>
                        <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#0ff" />
                            <stop offset="100%" stop-color="#0055ff" />
                        </linearGradient>
                    </defs>
                    <path d="M70,80 L50,10 L80,60 Z" fill="url(#heroGrad)" opacity="0.8"/>
                    <path d="M130,80 L150,10 L120,60 Z" fill="url(#heroGrad)" opacity="0.8"/>
                    <circle cx="100" cy="100" r="40" fill="#050510" stroke="url(#heroGrad)" stroke-width="4"/>
                    <path d="M70,95 Q100,120 130,95 Q100,110 70,95" fill="#f0f" filter="drop-shadow(0 0 5px #f0f)"/>
                    <path d="M60,150 L30,220 L170,220 L140,150 Q100,170 60,150" fill="url(#heroGrad)" opacity="0.9"/>
                    <circle cx="100" cy="180" r="15" fill="#fff" filter="drop-shadow(0 0 10px #0ff)"/>
                </svg>`,
            nexus: `
                <svg viewBox="0 0 200 300" class="w-full h-full drop-shadow-[0_0_20px_rgba(0,255,100,0.8)]">
                    <defs>
                        <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#0f5" />
                            <stop offset="100%" stop-color="#055" />
                        </linearGradient>
                    </defs>
                    <path d="M100,40 Q150,100 180,250 L20,250 Q50,100 100,40" fill="url(#nexusGrad)" opacity="0.5"/>
                    <circle cx="100" cy="70" r="25" fill="#fff" filter="drop-shadow(0 0 15px #0f5)"/>
                    <circle cx="70" cy="30" r="5" fill="#0f5"/><circle cx="130" cy="40" r="5" fill="#0f5"/>
                    <circle cx="50" cy="80" r="8" fill="#0f5"/><circle cx="150" cy="90" r="6" fill="#0f5"/>
                    <path d="M100,100 L100,250" stroke="#fff" stroke-width="2" opacity="0.5"/>
                </svg>`,
            crisis: `
                <svg viewBox="0 0 200 300" class="w-full h-full drop-shadow-[0_0_15px_rgba(255,0,80,0.8)]">
                    <defs>
                        <linearGradient id="crisisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f05" />
                            <stop offset="100%" stop-color="#500" />
                        </linearGradient>
                    </defs>
                    <path d="M100,50 L140,80 L120,130 L160,180 L100,250 L40,180 L80,130 L60,80 Z" fill="url(#crisisGrad)" opacity="0.8"/>
                    <circle cx="85" cy="110" r="8" fill="#fff" filter="drop-shadow(0 0 8px #f05)" />
                    <circle cx="115" cy="110" r="8" fill="#fff" filter="drop-shadow(0 0 8px #f05)" />
                    <rect x="30" y="150" width="140" height="4" fill="#0ff" opacity="0.7"/>
                    <rect x="50" y="170" width="100" height="2" fill="#fff" opacity="0.5"/>
                </svg>`,
            harmony: `
                <svg viewBox="0 0 200 300" class="w-full h-full drop-shadow-[0_0_20px_rgba(255,255,0,0.8)]">
                    <defs>
                        <linearGradient id="harmonyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff0" />
                            <stop offset="100%" stop-color="#fa0" />
                        </linearGradient>
                    </defs>
                    <circle cx="100" cy="150" r="40" fill="none" stroke="url(#harmonyGrad)" stroke-width="6"/>
                    <circle cx="100" cy="150" r="60" fill="none" stroke="#f0f" stroke-width="2" opacity="0.5"/>
                    <path d="M100,150 L100,50" stroke="#fff" stroke-width="3"/>
                    <circle cx="100" cy="50" r="10" fill="#ff0" filter="drop-shadow(0 0 8px #ff0)"/>
                </svg>`
        };
    </script>

    <script>
        lucide.createIcons();

        // Game State
        let gameState = 'menu'; // menu, explore, dialogue, victory
        let resonance = 0;
        let currentNPC = null;
        
        // Input State
        const keys = { w: false, a: false, s: false, d: false };

        // Three.js Globals
        let scene, camera, renderer, clock;
        let playerMesh, playerLight;
        let envNodes = [];
        let hiveParticles;
        let interactionPulse;

        // Camera interpolation
        let targetCamPos = new THREE.Vector3();
        let targetCamLook = new THREE.Vector3();
        let currentCamLook = new THREE.Vector3();
        
        // Dialogue state management
        let currentLines = [];
        let currentLineIndex = 0;
        let isTyping = false;
        let typeTimeout;

        const StoryData = {
            nexus: {
                id: 'nexus',
                speaker: 'Gaia-Node 01',
                title: 'Planetarer Nexus',
                art: CharacterArt.nexus,
                color: '#34d399',
                lines: [
                    {
                        text: "Willkommen, Projekt Aura-Hase. Ich bin ein Knotenpunkt des planetaren Ökosystems. Unsere Systeme kollabieren durch eine schwere Fragmentierung."
                    },
                    {
                        text: "Die Menschheit hat vergessen, dass sie Teil eines einzigen, atmenden Organismus ist. Diese Illusion der Trennung - Isolationismus, Ausbeutung - manifestiert sich als physische Korruption im Netz."
                    },
                    {
                        text: "Nur durch das gemeinsame 'Hive-Mind' - unsere geteilten Träume, Empathie und kollektive Verantwortung - können wir das System heilen. Wirst du helfen, das Netzwerk neu zu knüpfen?",
                        choices: [
                            { text: "Ich bin bereit. Wie reparieren wir es?", next: 'accept' },
                            { text: "Ist das Hive-Mind nicht gefährlich? (Assimilation)", next: 'question' }
                        ]
                    }
                ],
                branches: {
                    accept: [
                        {
                            text: "Finde die korrupten System-Glitches. Repariere sie durch Resonanz, nicht durch Gewalt. Erinnere sie an ihre Verbindung zum Ganzen.",
                            action: () => activateQuest('crisis')
                        }
                    ],
                    question: [
                        {
                            text: "Ein gesundes Hive-Mind löscht das Individuum nicht aus; es orchestriert individuelle Stärken zu einer Symphonie. Eine Zelle opfert sich nicht für den Körper, sie IST der Körper.",
                            action: () => activateQuest('crisis')
                        }
                    ]
                }
            },
            crisis: {
                id: 'crisis',
                speaker: 'System-Glitch',
                title: 'Manifestierte Isolation',
                art: CharacterArt.crisis,
                color: '#f43f5e',
                lines: [
                    {
                        text: "LÄRM... KONSUM... WACHSTUM UM JEDEN PREIS... Das System verlangt nach mehr. Wir sind getrennt. Du kannst uns nicht heilen.",
                        classes: "glitch-text font-black uppercase",
                        choices: [
                            { text: "[Aura projizieren] Du bist nicht getrennt. Du bist ein Teil von uns.", next: 'heal' },
                            { text: "[System überschreiben] Zerstöre die Anomalie!", next: 'destroy' }
                        ]
                    }
                ],
                branches: {
                    heal: [
                        {
                            text: "Der Lärm... verklingt. Ich erinnere mich an den gemeinsamen Traum. Das Ökosystem... atmet auf.",
                            speaker: 'Geheilter Knoten',
                            color: '#22d3ee',
                            art: CharacterArt.hero,
                            action: () => healGlitch()
                        }
                    ],
                    destroy: [
                        {
                            text: "Gewalt erzeugt nur eine neue Wunde im Netz. Isolation kann man nicht isolieren...",
                            action: () => failHeal()
                        }
                    ]
                }
            },
            harmony: {
                id: 'harmony',
                speaker: 'Harmonie-Sphäre',
                title: 'Kollektiver Traum',
                art: CharacterArt.harmony,
                color: '#facc15',
                lines: [
                    {
                        text: "Du hast die ersten Knoten geheilt. Spürst du die Resonanz? Das Netz erwacht. Aber es gibt noch mehr zu tun..."
                    }
                ]
            }
        };

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050510, 0.025);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Lighting
            const ambient = new THREE.AmbientLight(0x111133, 2.5);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);
            const pointLight1 = new THREE.PointLight(0x00ffff, 1.5, 50);
            pointLight1.position.set(0, 10, 0);
            scene.add(pointLight1);
            const pointLight2 = new THREE.PointLight(0xff00ff, 1.5, 50);
            pointLight2.position.set(10, 5, -10);
            scene.add(pointLight2);

            // Grid with holographic feel
            const gridHelper = new THREE.GridHelper(120, 120, 0x00ffff, 0x002244);
            gridHelper.position.y = -1;
            gridHelper.material.transparent = true;
            gridHelper.material.opacity = 0.25;
            scene.add(gridHelper);

            // Additional environmental detail (floating rings)
            for (let i = 0; i < 15; i++) {
                const ringGeo = new THREE.TorusGeometry(2 + Math.random()*5, 0.05, 16, 64);
                const ringMat = new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? 0x00ffff : 0xff00ff, emissive: 0x111111, roughness: 0.4, metalness: 0.8, transparent: true, opacity: 0.6 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                const angle = Math.random() * Math.PI * 2;
                const radius = 10 + Math.random() * 25;
                ring.position.set(Math.cos(angle)*radius, Math.random()*10 - 1, Math.sin(angle)*radius);
                ring.rotation.x = Math.PI / 2 + (Math.random()-0.5)*0.5;
                ring.rotation.y = Math.random() * Math.PI;
                scene.add(ring);
            }

            createPlayer();
            createEnvironment();
            createHiveParticles();
            createNPCs();

            // Interaction pulse ring (visual feedback)
            const pulseGeo = new THREE.RingGeometry(1.5, 1.7, 64);
            const pulseMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0 });
            interactionPulse = new THREE.Mesh(pulseGeo, pulseMat);
            interactionPulse.rotation.x = Math.PI / 2;
            interactionPulse.position.y = 0.1;
            interactionPulse.visible = false;
            scene.add(interactionPulse);

            // Initial Camera Setup
            camera.position.set(0, 15, 30);
            camera.lookAt(0, 5, 0);

            window.addEventListener('resize', onWindowResize);
            setupInput();

            animate();
        }

        function createPlayer() {
            const geometry = new THREE.CapsuleGeometry(0.5, 1, 4, 16);
            const material = new THREE.MeshPhysicalMaterial({ 
                color: 0x00ffff, 
                emissive: 0x0055ff,
                emissiveIntensity: 0.7,
                transmission: 0.9,
                opacity: 1,
                metalness: 0.1,
                roughness: 0.1,
                ior: 1.5
            });
            playerMesh = new THREE.Mesh(geometry, material);
            playerMesh.position.set(0, 0.5, 5);
            playerMesh.castShadow = false;
            playerMesh.receiveShadow = false;
            scene.add(playerMesh);

            // Aura rings
            const ringGeo = new THREE.RingGeometry(0.8, 0.9, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xff00ff, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
            const auraRing = new THREE.Mesh(ringGeo, ringMat);
            auraRing.rotation.x = Math.PI / 2;
            auraRing.position.y = -0.4;
            playerMesh.add(auraRing);

            const outerRing = new THREE.RingGeometry(1.1, 1.15, 32);
            const outerRingMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
            const outerRingMesh = new THREE.Mesh(outerRing, outerRingMat);
            outerRingMesh.rotation.x = Math.PI / 2;
            outerRingMesh.position.y = -0.2;
            playerMesh.add(outerRingMesh);

            playerLight = new THREE.PointLight(0x00ffff, 2, 10);
            playerLight.position.y = 1;
            playerMesh.add(playerLight);
        }

        function createHiveParticles() {
            const particleCount = 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const color1 = new THREE.Color(0x00ffff);
            const color2 = new THREE.Color(0xff00ff);
            const color3 = new THREE.Color(0x00ff55);

            for(let i = 0; i < particleCount; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = 2 * Math.PI * u;
                const phi = Math.acos(2 * v - 1);
                const r = 20 + Math.random() * 40;

                positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta) + 10;
                positions[i*3+2] = r * Math.cos(phi);

                const t = Math.random();
                let mixedColor;
                if (t < 0.5) mixedColor = color1.clone().lerp(color2, Math.random());
                else mixedColor = color1.clone().lerp(color3, Math.random());
                colors[i*3] = mixedColor.r;
                colors[i*3+1] = mixedColor.g;
                colors[i*3+2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.25,
                vertexColors: true,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            hiveParticles = new THREE.Points(geometry, material);
            hiveParticles.frustumCulled = false;
            scene.add(hiveParticles);
        }

        function createNPCs() {
            // Nexus Tree
            const treeGeo = new THREE.OctahedronGeometry(2, 2);
            const treeMat = new THREE.MeshPhysicalMaterial({ color: 0x00ff55, emissive: 0x00aa22, wireframe: true, roughness: 0.3, metalness: 0.2 });
            const nexus = new THREE.Mesh(treeGeo, treeMat);
            nexus.position.set(0, 2, -10);
            
            const ringGeo = new THREE.RingGeometry(3, 3.2, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff55, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = -1.9;
            nexus.add(ring);

            // Glow sphere inside
            const glowGeo = new THREE.SphereGeometry(0.8, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({ color: 0x00ff55, transparent: true, opacity: 0.4 });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            glow.position.y = 0.5;
            nexus.add(glow);

            nexus.userData = { type: 'npc', id: 'nexus' };
            scene.add(nexus);
            envNodes.push(nexus);

            // Crisis Glitch Node
            const glitchGeo = new THREE.IcosahedronGeometry(1.5, 0);
            const glitchMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
            const crisis = new THREE.Mesh(glitchGeo, glitchMat);
            crisis.position.set(15, 1.5, -5);
            crisis.userData = { type: 'npc', id: 'crisis', isGlitch: true };
            
            const gRingGeo = new THREE.RingGeometry(2.5, 2.7, 32);
            const gRingMat = new THREE.MeshBasicMaterial({ color: 0xff0055, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
            const gRing = new THREE.Mesh(gRingGeo, gRingMat);
            gRing.rotation.x = Math.PI / 2;
            gRing.position.y = -1.4;
            crisis.add(gRing);

            // Corrupted glow
            const corruptGlowGeo = new THREE.SphereGeometry(0.6, 16, 16);
            const corruptGlowMat = new THREE.MeshBasicMaterial({ color: 0xff0055, transparent: true, opacity: 0.5 });
            const corruptGlow = new THREE.Mesh(corruptGlowGeo, corruptGlowMat);
            corruptGlow.position.y = 0.5;
            crisis.add(corruptGlow);

            scene.add(crisis);
            envNodes.push(crisis);

            // Harmony Sphere (appears after crisis healed)
            const harmonyGeo = new THREE.IcosahedronGeometry(1.8, 1);
            const harmonyMat = new THREE.MeshPhysicalMaterial({ color: 0xffaa00, emissive: 0xff8800, wireframe: true, roughness: 0.2, metalness: 0.6 });
            const harmony = new THREE.Mesh(harmonyGeo, harmonyMat);
            harmony.position.set(-15, 2.5, -8);
            harmony.userData = { type: 'npc', id: 'harmony', hidden: true };
            harmony.visible = false;
            scene.add(harmony);
            envNodes.push(harmony);

            // Add additional decorative nodes (non-interactive)
            for (let i = 0; i < 5; i++) {
                const decoGeo = new THREE.TetrahedronGeometry(1.2);
                const decoMat = new THREE.MeshStandardMaterial({ color: 0x3366ff, emissive: 0x112244, roughness: 0.5, metalness: 0.3 });
                const deco = new THREE.Mesh(decoGeo, decoMat);
                const angle = Math.random() * Math.PI * 2;
                const radius = 18 + Math.random() * 10;
                deco.position.set(Math.cos(angle)*radius, Math.random()*4 + 1, Math.sin(angle)*radius);
                scene.add(deco);
            }
        }

        function createEnvironment() {
            // Abstract floating structures representing data systems
            for(let i=0; i<25; i++) {
                const h = 2 + Math.random() * 10;
                const geo = new THREE.BoxGeometry(1, h, 1);
                const mat = new THREE.MeshBasicMaterial({ color: 0x112244, transparent: true, opacity: 0.4, wireframe: true });
                const mesh = new THREE.Mesh(geo, mat);
                
                const angle = Math.random() * Math.PI * 2;
                const radius = 15 + Math.random() * 25;
                mesh.position.set(Math.cos(angle)*radius, h/2 - 1, Math.sin(angle)*radius);
                mesh.rotation.y = Math.random() * Math.PI;
                scene.add(mesh);
            }

            // Energy pillars
            for(let i=0; i<10; i++) {
                const pillarGeo = new THREE.CylinderGeometry(0.3, 0.5, 8, 8);
                const pillarMat = new THREE.MeshStandardMaterial({ color: 0x224466, emissive: 0x112233, roughness: 0.3, metalness: 0.8, transparent: true, opacity: 0.6 });
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                const angle = (i / 10) * Math.PI * 2;
                const radius = 30;
                pillar.position.set(Math.cos(angle)*radius, 3, Math.sin(angle)*radius);
                pillar.rotation.z = (Math.random()-0.5)*0.3;
                pillar.rotation.x = (Math.random()-0.5)*0.3;
                scene.add(pillar);
            }
        }

        // Dialogue System Functions
        function startDialogue(nodeId) {
            if (gameState === 'dialogue') return;
            gameState = 'dialogue';
            currentNPC = envNodes.find(n => n.userData.id === nodeId);
            
            const nodeData = StoryData[nodeId];
            if (!nodeData) return;

            // Set initial lines
            currentLines = nodeData.lines;
            currentLineIndex = 0;

            // Update UI
            document.getElementById('controls-ui').classList.add('opacity-0');
            document.getElementById('interact-prompt').classList.add('hidden');
            document.getElementById('dialogue-overlay').classList.remove('translate-y-32');
            document.getElementById('paperdoll').classList.add('active');
            
            // Set camera target
            if (currentNPC) {
                const dir = new THREE.Vector3().subVectors(currentNPC.position, playerMesh.position).normalize();
                targetCamPos.copy(playerMesh.position).sub(dir.multiplyScalar(3));
                targetCamPos.y = 2.5;
                targetCamLook.copy(currentNPC.position);
                targetCamLook.y = 1.5;
            }

            showDialogueLine(currentLines[currentLineIndex]);
        }

        function showDialogueLine(lineObj) {
            const textEl = document.getElementById('dialogue-text');
            const choicesContainer = document.getElementById('dialogue-choices');
            const nextBtn = document.getElementById('dialogue-next');
            
            // Clear typing
            if (typeTimeout) clearTimeout(typeTimeout);
            textEl.innerHTML = '';
            choicesContainer.innerHTML = '';
            choicesContainer.classList.add('hidden');
            nextBtn.classList.add('hidden');
            
            // Apply line-specific styling
            if (lineObj.classes) {
                textEl.className = `text-sm md:text-base lg:text-lg leading-relaxed cursor ${lineObj.classes}`;
            } else {
                textEl.className = "text-sm md:text-base lg:text-lg text-slate-200 leading-relaxed font-light min-h-[4rem] cursor";
            }

            // Update speaker/art/color if provided in line
            if (lineObj.speaker) {
                document.getElementById('speaker-name').innerText = lineObj.speaker;
            }
            if (lineObj.color) {
                document.getElementById('speaker-name').style.color = lineObj.color;
            } else if (currentNPC && StoryData[currentNPC.userData.id]) {
                document.getElementById('speaker-name').style.color = StoryData[currentNPC.userData.id].color;
            }
            if (lineObj.art) {
                document.getElementById('character-art').innerHTML = lineObj.art;
            }

            // Typing effect
            isTyping = true;
            let charIndex = 0;
            const text = lineObj.text;

            function typeChar() {
                if(charIndex < text.length) {
                    textEl.innerHTML = text.substring(0, charIndex + 1);
                    charIndex++;
                    typeTimeout = setTimeout(typeChar, 15);
                } else {
                    isTyping = false;
                    textEl.classList.remove('cursor');
                    
                    if (lineObj.choices && lineObj.choices.length > 0) {
                        choicesContainer.classList.remove('hidden');
                        lineObj.choices.forEach(ch => {
                            const btn = document.createElement('button');
                            btn.className = 'w-full text-left px-4 py-3 bg-slate-800/80 hover:bg-slate-700 rounded-xl border border-cyan-500/30 hover:border-cyan-400 text-cyan-300 font-bold transition transform hover:scale-[1.02]';
                            btn.innerText = ch.text;
                            btn.onclick = () => handleChoice(ch);
                            choicesContainer.appendChild(btn);
                        });
                    } else if (lineObj.action) {
                        nextBtn.classList.remove('hidden');
                        document.getElementById('btn-next-dialogue').onclick = () => {
                            const action = lineObj.action;
                            endDialogue();
                            action();
                        };
                    } else {
                        nextBtn.classList.remove('hidden');
                        document.getElementById('btn-next-dialogue').onclick = nextDialogue;
                    }
                }
            }
            typeChar();
        }

        function nextDialogue() {
            if (isTyping) {
                // Skip typing
                clearTimeout(typeTimeout);
                isTyping = false;
                const line = currentLines[currentLineIndex];
                document.getElementById('dialogue-text').innerHTML = line.text;
                document.getElementById('dialogue-text').classList.remove('cursor');
                // Show choices/next as if typing completed
                const choicesContainer = document.getElementById('dialogue-choices');
                const nextBtn = document.getElementById('dialogue-next');
                if (line.choices && line.choices.length > 0) {
                    choicesContainer.classList.remove('hidden');
                    line.choices.forEach(ch => {
                        const btn = document.createElement('button');
                        btn.className = 'w-full text-left px-4 py-3 bg-slate-800/80 hover:bg-slate-700 rounded-xl border border-cyan-500/30 hover:border-cyan-400 text-cyan-300 font-bold transition transform hover:scale-[1.02]';
                        btn.innerText = ch.text;
                        btn.onclick = () => handleChoice(ch);
                        choicesContainer.appendChild(btn);
                    });
                } else if (line.action) {
                    nextBtn.classList.remove('hidden');
                    document.getElementById('btn-next-dialogue').onclick = () => {
                        const action = line.action;
                        endDialogue();
                        action();
                    };
                } else {
                    nextBtn.classList.remove('hidden');
                    document.getElementById('btn-next-dialogue').onclick = nextDialogue;
                }
                return;
            }

            currentLineIndex++;
            if (currentLineIndex < currentLines.length) {
                showDialogueLine(currentLines[currentLineIndex]);
            } else {
                endDialogue();
            }
        }

        function handleChoice(choice) {
            if (choice.next) {
                const nodeData = StoryData[currentNPC.userData.id];
                if (nodeData && nodeData.branches && nodeData.branches[choice.next]) {
                    currentLines = nodeData.branches[choice.next];
                    currentLineIndex = 0;
                    showDialogueLine(currentLines[0]);
                }
            }
        }

        function endDialogue() {
            gameState = 'explore';
            document.getElementById('dialogue-overlay').classList.add('translate-y-32');
            document.getElementById('paperdoll').classList.remove('active');
            document.getElementById('controls-ui').classList.remove('opacity-0');
            currentNPC = null; // Reset NPC reference; will be re-detected by proximity
        }

        function activateQuest(nodeId) {
            document.getElementById('current-objective').innerText = "Finde den " + (nodeId === 'crisis' ? 'System-Glitch' : 'Harmonie-Sphäre');
        }

        function healGlitch() {
            resonance += 50;
            updateResonanceUI();
            document.getElementById('current-objective').innerText = "System stabilisiert. Finde die Harmonie-Sphäre";
            
            // Visual update of glitch node
            const glitchNode = envNodes.find(n => n.userData.id === 'crisis');
            if (glitchNode) {
                glitchNode.material.color.setHex(0x00ffff);
                glitchNode.children.forEach(child => {
                    if (child.material && child.material.color) child.material.color.setHex(0x00ffff);
                });
                glitchNode.userData.isGlitch = false;
            }

            // Reveal harmony node after a delay
            setTimeout(() => {
                const harmonyNode = envNodes.find(n => n.userData.id === 'harmony');
                if (harmonyNode) {
                    harmonyNode.visible = true;
                    harmonyNode.userData.hidden = false;
                }
            }, 1500);
        }

        function failHeal() {
            document.getElementById('current-objective').innerText = "Mission fehlgeschlagen. System fragmentiert.";
            resonance = Math.max(0, resonance - 20);
            updateResonanceUI();
        }

        function updateResonanceUI() {
            document.getElementById('resonance-score').innerText = `${resonance}%`;
            const bar = document.getElementById('sync-bar');
            bar.style.width = `${resonance}%`;
            if (resonance >= 100) {
                gameState = 'victory';
                document.getElementById('current-objective').innerText = "Hive-Mind vereint! Du hast das Ökosystem geheilt!";
                // Could show a victory overlay
            }
        }

        function setupInput() {
            document.getElementById('btn-start').addEventListener('click', () => {
                document.getElementById('main-menu').classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    document.getElementById('game-ui').classList.remove('opacity-0');
                    gameState = 'explore';
                    currentCamLook.copy(playerMesh.position);
                }, 1000);
            });

            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (keys.hasOwnProperty(k)) keys[k] = true;
                if (k === 'e' && currentNPC && gameState === 'explore') startDialogue(currentNPC.userData.id);
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (keys.hasOwnProperty(k)) keys[k] = false;
            });

            const bindBtn = (id, key) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
                el.addEventListener('mousedown', (e) => { e.preventDefault(); keys[key] = true; });
                el.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; });
            };
            bindBtn('btn-up', 'w'); bindBtn('btn-down', 's');
            bindBtn('btn-left', 'a'); bindBtn('btn-right', 'd');
            
            document.getElementById('btn-action').addEventListener('click', () => {
                if(currentNPC && gameState === 'explore') startDialogue(currentNPC.userData.id);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (hiveParticles) {
                hiveParticles.rotation.y = time * 0.03;
                hiveParticles.rotation.x = Math.sin(time * 0.02) * 0.1;
                hiveParticles.rotation.z = Math.cos(time * 0.015) * 0.05;
            }

            envNodes.forEach(node => {
                if (node.userData.hidden) return;
                node.rotation.y += delta * 0.5;
                if (node.userData.isGlitch) {
                    node.position.y = 1.5 + Math.sin(time * 4 + node.position.x) * 0.3;
                    node.rotation.x += delta * (Math.random() * 3);
                } else {
                    node.position.y = 2 + Math.sin(time * 2 + node.position.x) * 0.2;
                }
                // Pulsing rings
                node.children.forEach(child => {
                    if (child.geometry && child.geometry.type === 'RingGeometry') {
                        const scale = 1 + Math.sin(time * 3 + node.position.x) * 0.1;
                        child.scale.set(scale, scale, 1);
                    }
                });
            });

            // Interaction pulse effect
            if (interactionPulse) {
                if (currentNPC && gameState === 'explore') {
                    interactionPulse.visible = true;
                    interactionPulse.position.copy(currentNPC.position);
                    interactionPulse.position.y = 0.1;
                    const pulse = (Math.sin(time * 5) + 1) / 2;
                    interactionPulse.material.opacity = pulse * 0.6;
                    const scale = 1 + pulse * 1.5;
                    interactionPulse.scale.set(scale, scale, 1);
                } else {
                    interactionPulse.visible = false;
                }
            }

            if (gameState === 'explore') {
                const speed = 6 * delta;
                let moved = false;
                if (keys.w) { playerMesh.position.z -= speed; moved = true; }
                if (keys.s) { playerMesh.position.z += speed; moved = true; }
                if (keys.a) { playerMesh.position.x -= speed; moved = true; }
                if (keys.d) { playerMesh.position.x += speed; moved = true; }

                if (moved) {
                    playerMesh.position.y = 0.5 + Math.abs(Math.sin(time * 10)) * 0.2;
                    const angle = Math.atan2(
                        (keys.w ? -1 : 0) + (keys.s ? 1 : 0),
                        (keys.a ? -1 : 0) + (keys.d ? 1 : 0)
                    );
                    playerMesh.rotation.y = -angle;
                } else {
                    playerMesh.position.y = THREE.MathUtils.lerp(playerMesh.position.y, 0.5, 0.1);
                }

                targetCamPos.set(playerMesh.position.x, 8, playerMesh.position.z + 10);
                targetCamLook.copy(playerMesh.position);

                // Check proximity to NPCs
                let closeNPC = null;
                envNodes.forEach(node => {
                    if (node.userData.hidden) return;
                    const dist = playerMesh.position.distanceTo(node.position);
                    if (dist < 4) closeNPC = node;
                });

                if (closeNPC && currentNPC !== closeNPC) {
                    currentNPC = closeNPC;
                    document.getElementById('interact-prompt').classList.remove('hidden');
                } else if (!closeNPC && currentNPC) {
                    currentNPC = null;
                    document.getElementById('interact-prompt').classList.add('hidden');
                }
            } else if (gameState === 'menu') {
                targetCamPos.x = Math.sin(time * 0.2) * 30;
                targetCamPos.z = Math.cos(time * 0.2) * 30;
                targetCamPos.y = 10 + Math.sin(time * 0.5) * 5;
                targetCamLook.set(0, 0, 0);
            } else if (gameState === 'victory') {
                targetCamPos.set(0, 20, 30);
                targetCamLook.set(0, 0, 0);
            }
            // In dialogue, targetCamPos is set by startDialogue

            camera.position.lerp(targetCamPos, 0.05);
            currentCamLook.lerp(targetCamLook, 0.05);
            camera.lookAt(currentCamLook);

            renderer.render(scene, camera);
        }

        window.onload = init3D;
    </script>
</body>
</html>
